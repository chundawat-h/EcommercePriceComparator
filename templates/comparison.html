<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Comparison Results</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="bg-dark py-3">
        <div class="container">
            <div class="d-flex flex-column flex-md-row align-items-center justify-content-between">
                <h1 class="fs-4 mb-2 mb-md-0">
                    <a href="/" class="text-white text-decoration-none">
                        <i class="bi bi-arrow-left me-2"></i>E-commerce Price Comparator
                    </a>
                </h1>
                <div class="search-box d-flex align-items-center bg-dark-subtle rounded ps-3 pe-1 py-1">
                    <span class="me-2">Showing results for:</span>
                    <span id="query-display" class="fw-bold"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="py-4">
        <div class="container">
            <!-- Error Container -->
            <div id="error-container" style="display: none;"></div>
            
            <!-- Loading Indicator -->
            <div id="loading-indicator" class="loading-container" style="display: none;">
                <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
                <p class="mt-3">Fetching products from Amazon and Flipkart...</p>
                <p class="text-muted small">This may take up to 30 seconds</p>
            </div>
            
            <!-- Results Container -->
            <div id="results-container" style="display: none;">
                <!-- Product Comparison Table -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h4 class="mb-0">Product Comparison Results</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="comparison-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Product</th>
                                        <th>Amazon</th>
                                        <th>Flipkart</th>
                                        <th>Recommendation</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="comparison-table-body">
                                    <!-- Comparison rows will be added here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <!-- Hidden sections for individual platform results -->
                <div id="amazon-results" style="display: none;"></div>
                <div id="flipkart-results" style="display: none;"></div>
                <div id="recommendations" style="display: none;"></div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white-50 py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0 small">
                &copy; 2023 E-commerce Price Comparator | 
                <a href="/" class="text-white-50">New Search</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="\static\js\comparison.js"></script>
</body>
</html>
